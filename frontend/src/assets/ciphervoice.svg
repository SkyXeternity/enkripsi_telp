<svg width="200" height="200" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradasi dari biru cyan di kanan atas ke hijau teal di kiri bawah -->
    <linearGradient id="bg-gradient" x1="85" y1="10" x2="15" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Kotak dengan sudut melengkung (rounded square) -->
  <rect x="4" y="4" width="92" height="92" rx="28" fill="url(#bg-gradient)" />

  <!-- Ikon Sinyal / Radio di tengah -->
  <g stroke="#080D1A" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Lingkaran pusat -->
    <circle cx="50" cy="50" r="4.5" />
    
    <!-- Gelombang dalam (kiri & kanan) -->
    <path d="M 39.4 39.4 A 15 15 0 0 0 39.4 60.6" />
    <path d="M 60.6 39.4 A 15 15 0 0 1 60.6 60.6" />
    
    <!-- Gelombang luar (kiri & kanan) -->
    <path d="M 31.6 31.6 A 26 26 0 0 0 31.6 68.4" />
    <path d="M 68.4 31.6 A 26 26 0 0 1 68.4 68.4" />
  </g>
</svg>